baseURL = 'https://rphilips.github.io/okra'
languageCode = 'nl'
title = "Schaken bij OKRA Eke"
theme = 'ananke'
copyright = 'OKRA Eke'
defaultContentLanguage = 'nl'
enableEmoji = true


resourceDir = "../resources"


SectionPagesMenu = "main"
Paginate = 6                  # this is set low for demonstrating with dummy content. Set to a higher number
googleAnalytics = ""
enableRobotsTXT = true

[languages]
[languages.nl]
title = "Start"
weight = 1
contentDir = "content"
# languageDirection = 'rtl' for Right-To-Left languages


[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[params]
text_color = ""
author = ""
favicon = "/images/favicon.ico"
site_logo = ""
description = "De laatste hobby die je ooit nodig hebt …"
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
background_color_class = "bg-black"
recent_posts_number = 3

[caches]
  [caches.images]
    dir = ':cacheDir/images'


[frontmatter]
  date = ['date', 'publishdate', 'pubdate', 'published', 'lastmod', 'modified']
  expiryDate = ['expirydate', 'unpublishdate']
  lastmod = [':git', 'lastmod', 'modified', 'date', 'publishdate', 'pubdate', 'published']
  publishDate = ['publishdate', 'pubdate', 'published', 'date']
