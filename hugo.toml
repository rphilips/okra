baseURL = 'https://rphilips.github.io/okra'

title = "Schaken bij OKRA-Eke"
theme = 'ananke'
copyright = 'OKRA-Eke'
defaultContentLanguage = 'nl'
enableEmoji = true


resourceDir = "../resources"


SectionPagesMenu = "main"
mainSections = ['sessions', 'articles', 'games', 'puzzles', 'about', 'contact']
Paginate = 20                  # this is set low for demonstrating with dummy content. Set to a higher number
googleAnalytics = ""
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS"]


[security]
  enableInlineShortcodes = true

[languages]
[languages.nl]
title = "Start"
contentDir = "content"
# languageDirection = 'rtl' for Right-To-Left languages

[markup.goldmark.renderer]
unsafe = true

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[params]
text_color = ""
author = ""
favicon = "/images/favicon.ico"
site_logo = ""
description = "De laatste hobby die je ooit nodig hebt …"
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
background_color_class = "bg-black"
recent_posts_number = 20

[caches]
  [caches.images]
    dir = ':cacheDir/images'

